version: 2

# Weekly updates, one grouped pull request per ecosystem, so a week's worth of
# bumps lands as one reviewable change. The pre-commit and github-actions
# ecosystems matter here because the workflow pins every action to a full
# commit SHA: Dependabot moves the SHA and keeps the trailing "# vX.Y.Z"
# comment, so the pins stay current without hand edits.
#
# Each ecosystem waits 7 days after a release before proposing it, to stay
# clear of hijacked releases, which are usually caught within a few days. This
# matches exclude-newer in pyproject.toml, which applies the same rule to uv.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Bumps the ruff and other hook revisions in .pre-commit-config.yaml. This
  # is the only automatic route for those pins, since no one runs
  # `pre-commit autoupdate` by hand.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
